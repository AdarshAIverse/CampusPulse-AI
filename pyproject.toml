[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campuspulse-ai"
version = "2.0.0"
description = "Privacy-aware smart campus analytics prototype"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.36,<2", "pandas>=2.1,<4", "numpy>=1.26,<3", "plotly>=5.20,<7", "matplotlib>=3.8,<4", "seaborn>=0.13,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
